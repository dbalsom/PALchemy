[workspace]
resolver = "2"
members = [
    "crates/dipsvg-rs",
    "crates/palcore",
    "crates/palhal",
    "crates/palgui",
    "crates/palapp",
    "crates/palcli",
    "crates/teefo-rs",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.dependencies]
leptos = { version = "0.8" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_axum = { version = "0.8" }
axum = "0.8"
cfg-if = "1"
console_error_panic_hook = "0.1"
console_log = "1"
http = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
toml = "0.8"
toml_edit = "0.22"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
wasm-bindgen = "0.2"
