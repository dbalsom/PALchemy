[package]
name = "teefo-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
futures = "0.3.32"
maplit = "1.0.2"
nusb = { version = "0.2.2", features = ["tokio"] }
palcore = { path = "../palcore" }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1.43.0", features = ["io-util", "time", "macros"] }
tracing = "0.1.44"
async-trait = "0.1.86"
